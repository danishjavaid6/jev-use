name: MCP connection
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  connection:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - if: runner.os == 'Windows'
        run: .venv\Scripts\python.exe -m pip install -e ".[dev,live]"
      - if: runner.os != 'Windows'
        run: .venv/bin/python -m pip install -e ".[dev,live]"
      - if: runner.os == 'Windows'
        run: .venv\Scripts\python.exe -m pytest tests/test_mobile_mcp.py tests/test_facebook_pages_tools.py tests/test_facebook_runs.py tests/test_facebook_task.py tests/test_vision.py tests/test_betterwright.py tests/test_gologin.py -q
      - if: runner.os != 'Windows'
        run: .venv/bin/python -m pytest tests/test_mobile_mcp.py tests/test_facebook_pages_tools.py tests/test_facebook_runs.py tests/test_facebook_task.py tests/test_vision.py tests/test_betterwright.py tests/test_gologin.py -q
      - run: pnpm test
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'bin/dismiss-account-chooser.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
