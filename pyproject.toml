[project]
name = "jev-use"
version = "0.1.0"
description = "Computer-use decision loop: Cua Driver observes and acts, a typed chooser picks the action."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["typesafe-sdk"]
dev = ["pytest>=8"]

[project.scripts]
jev-use = "jev_use.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jev_use"]

[tool.pytest.ini_options]
testpaths = ["tests"]
