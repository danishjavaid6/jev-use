[project]
name = "jev-use"
version = "0.1.0"
description = "Computer-use decision loop: Cua Driver observes and acts, a typed chooser picks the action."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["typesafe-sdk"]
dev = ["pytest>=8"]

[project.scripts]
# Deliberately NOT `jev-use`: the npm package owns that name (it is the installer
# CLI), and a pip-installed `jev-use` would collide with it on PATH. This is the
# retired desktop surface, kept reachable under a name of its own. The Linux-only
# AT-SPI code behind it does not run on Windows.
jev-desktop = "jev_use.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jev_use"]

[tool.pytest.ini_options]
testpaths = ["tests"]
