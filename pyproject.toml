[project]
name = "jev-use"
version = "0.1.0"
description = "Computer-use decision loop: Cua Driver observes and acts, a typed chooser picks the action."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["typesafe-sdk"]
# The official GoLogin SDK: it launches a GoLogin profile in its original form
# (Orbita, its fingerprint, proxy and cookies) and returns the CDP address, which
# is what `browser_open(vendor="gologin")` drives. Optional because it is only
# needed by someone who actually uses GoLogin, and it pulls requests + psutil.
gologin = ["gologin"]
# browser-harness's transport: `cdp-use` holds ONE CDP websocket for the whole
# session instead of spawning a `cua-driver mcp` process per browser call, which is
# what `browser_use` -> `browser_read` -> `browser_extract` currently pays three
# times. We use the client directly rather than browser-harness's daemon because
# this MCP server is already a single long-lived process — see jev_use/harness.py.
# Installing `browser-harness` instead works too: it depends on the same client.
harness = ["cdp-use"]
dev = ["pytest>=8"]

[project.scripts]
# Deliberately NOT `jev-use`: the npm package owns that name (it is the installer
# CLI), and a pip-installed `jev-use` would collide with it on PATH. This is the
# retired desktop surface, kept reachable under a name of its own. The Linux-only
# AT-SPI code behind it does not run on Windows.
jev-desktop = "jev_use.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jev_use"]

[tool.pytest.ini_options]
testpaths = ["tests"]
